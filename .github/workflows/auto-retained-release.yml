name: Auto Retained Release

on:
  schedule:
    - cron: '17 */5 * * *'
  workflow_dispatch:

concurrency:
  group: auto-retained-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check for new upstream release
        id: check
        run: |
          TAG=$(curl -s \
            https://api.github.com/repos/0cwa/collieim-android/releases \
            | python3 -c "
              import sys, json
              data = json.load(sys.stdin)
              if not isinstance(data, list):
                  print('::error::Upstream API returned an error:', data.get('message', data), file=sys.stderr)
                  sys.exit(1)
              print([r['tag_name'] for r in data if not r['draft']][0])
              ")
          if [ -z "$TAG" ]; then
            echo "::error::Could not determine upstream release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if already built
        id: already
        env:
          TAG: ${{ steps.check.outputs.tag }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          EXISTS=$(curl -s -H "Authorization: token $PUSH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | python3 -c "
              import sys, json, os
              data = json.load(sys.stdin)
              if not isinstance(data, list):
                  print('no')
                  sys.exit(0)
              tag = os.environ['TAG']
              for r in data:
                  if r['tag_name'] == f'retained-{tag}':
                      if any(a['name'].endswith('.apk') for a in r['assets']):
                          print('yes')
                      else:
                          print('no')
                      break
              else:
                  print('no')
              ")
          echo "built=$EXISTS" >> "$GITHUB_OUTPUT"

      - name: Checkout retention branch
        if: steps.already.outputs.built == 'no'
        uses: actions/checkout@v5
        with:
          ref: retention
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Verify correct branch
        if: steps.already.outputs.built == 'no'
        run: |
          CURRENT=$(git rev-parse --abbrev-ref HEAD)
          if [ "$CURRENT" != "retention" ]; then
            echo "::warning::On '$CURRENT', not 'retention'. Fixing..."
            git checkout retention
          fi

      - name: Fetch upstream and rebase
        if: steps.already.outputs.built == 'no'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/0cwa/collieim-android.git 2>/dev/null || true
          git fetch upstream --tags
          NEW_TAG="${{ steps.check.outputs.tag }}"

          if git merge-base --is-ancestor "$NEW_TAG" retention 2>/dev/null; then
            echo "Already based on $NEW_TAG or later, no rebase needed"
          else
            BASE=$(git merge-base retention "$NEW_TAG")
            if [ -z "$BASE" ]; then
              echo "::warning::Could not find merge base. Skipping rebase."
              exit 0
            fi
            echo "Rebasing retention (base: $BASE) onto $NEW_TAG..."
            if git rebase --onto "$NEW_TAG" "$BASE" retention 2>/dev/null; then
              echo "Rebase succeeded"
              git push --force-with-lease origin retention
            else
              git rebase --abort
              echo "::warning::Rebase onto $NEW_TAG failed (conflicts). Building last known-good retention branch."
              echo "::warning::When you have time: git rebase --onto $NEW_TAG $(git rev-parse $BASE) retention && git push --force-with-lease origin retention"
            fi
          fi

      - name: Set up JDK 21
        if: steps.already.outputs.built == 'no'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode keystore
        if: steps.already.outputs.built == 'no'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build APK
        if: steps.already.outputs.built == 'no'
        run: |
          chmod +x gradlew
          rm -rf app/build/outputs/apk
          ./gradlew assembleProdWebsiteRelease \
            -x lintVitalProdWebsiteRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Find and rename APK
        if: steps.already.outputs.built == 'no'
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found. Build outputs:"
            find app/build/outputs -type f 2>/dev/null | head -30
            exit 1
          fi
          FINAL_NAME="collie-retained-${{ steps.check.outputs.tag }}.apk"
          mv "$APK" "./$FINAL_NAME"
          echo "Renamed to: $FINAL_NAME ($(du -h "./$FINAL_NAME" | cut -f1))"
          echo "path=./$FINAL_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.already.outputs.built == 'no'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "retained-${{ steps.check.outputs.tag }}"
          name: "Collie Retained ${{ steps.check.outputs.tag }}"
          body: '​'
          token: ${{ secrets.PUSH_TOKEN }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: ${{ steps.find_apk.outputs.path }}

      - name: Delete old releases (keep only latest)
        if: steps.already.outputs.built == 'no'
        env:
          CURRENT_TAG: "retained-${{ steps.check.outputs.tag }}"
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          if ! curl -s -H "Authorization: token $PUSH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | python3 -c "
              import sys, json, os
              data = json.load(sys.stdin)
              if not isinstance(data, list):
                  sys.exit(1)
              current = os.environ['CURRENT_TAG']
              for r in data:
                  if r['tag_name'].startswith('retained-') and r['tag_name'] != current:
                      print(r['id'])
              " > /tmp/old_release_ids.txt; then
            echo "::warning::Could not delete old releases (API error). Skipping cleanup."
            exit 0
          fi
          COUNT=0
          while read -r ID; do
            [ -z "$ID" ] && continue
            curl -s -X DELETE -H "Authorization: token $PUSH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$ID" > /dev/null
            COUNT=$((COUNT + 1))
          done < /tmp/old_release_ids.txt
          echo "Deleted $COUNT old release(s). Keeping: $CURRENT_TAG"
