name: Auto Retained Release

on:
  schedule:
    - cron: '17 */5 * * *'
  workflow_dispatch:

concurrency:
  group: auto-retained-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check for new upstream release
        id: check
        run: |
          TAG=$(curl -s \
            https://api.github.com/repos/0cwa/collieim-android/releases \
            | python3 -c "
              import sys, json
              data = json.load(sys.stdin)
              if not isinstance(data, list):
                  print('::error::Upstream API returned an error:', data.get('message', data), file=sys.stderr)
                  sys.exit(1)
              print([r['tag_name'] for r in data if not r['draft']][0])
              ")
          if [ -z "$TAG" ]; then
            echo "::error::Could not determine upstream release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if already built
        id: already
        env:
          TAG: ${{ steps.check.outputs.tag }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          EXISTS=$(curl -s -H "Authorization: token $PUSH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | python3 -c "
              import sys, json, os
              data = json.load(sys.stdin)
              if not isinstance(data, list):
                  print('no')
                  sys.exit(0)
              tag = os.environ['TAG']
              for r in data:
                  if r['tag_name'] in (f'retained-{tag}', f'retained-{tag}-r2'):
                      if any(a['name'].endswith('.apk') for a in r['assets']):
                          print('yes')
                      else:
                          print('no')
                      break
              else:
                  print('no')
              ")
          echo "built=$EXISTS" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream tag
        if: steps.already.outputs.built == 'no'
        uses: actions/checkout@v5
        with:
          repository: 0cwa/collieim-android
          ref: ${{ steps.check.outputs.tag }}
          fetch-depth: 0

      - name: Download retention patch
        if: steps.already.outputs.built == 'no'
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          curl -s -H "Authorization: token $PUSH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/retention.patch?ref=retention" \
            | python3 -c "import sys,json,base64; print(base64.b64decode(json.load(sys.stdin)['content']).decode())" \
            > /tmp/retention.patch
          if [ ! -s /tmp/retention.patch ]; then
            echo "::warning::retention.patch is empty. Building plain upstream (no retention features)."
          else
            echo "Patch: $(wc -l < /tmp/retention.patch) lines"
          fi

      - name: Download retention overlay
        if: steps.already.outputs.built == 'no'
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          curl -s -H "Authorization: token $PUSH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/retention-overlay.py?ref=retention" \
            | python3 -c "import sys,json,base64; print(base64.b64decode(json.load(sys.stdin)['content']).decode())" \
            > /tmp/retention-overlay.py 2>/dev/null || true
          if [ -s /tmp/retention-overlay.py ]; then
            echo "Overlay script ready."
          else
            echo "No overlay script found. Skipping."
          fi

      - name: Apply retention patch
        if: steps.already.outputs.built == 'no'
        run: |
          if [ ! -s /tmp/retention.patch ]; then
            echo "Empty patch, nothing to apply."
            exit 0
          fi

          if git apply --check /tmp/retention.patch 2>/dev/null; then
            echo "Patch applies cleanly."
            git apply /tmp/retention.patch
          else
            echo "Clean apply failed. Trying 3-way merge..."
            git apply --3way /tmp/retention.patch 2>&1 || true

            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              echo "3-way merge left conflicts. Resolving by taking upstream (HEAD):"
              echo "$CONFLICTS"
              echo "$CONFLICTS" | while read -r f; do
                git checkout HEAD -- "$f"
                git add "$f"
              done
              echo "Conflicts resolved (upstream version taken. Overlay will re-add retention fields)."
            elif [ -z "$(git status --porcelain)" ]; then
              echo "::error::Patch failed completely. Nothing was applied."
              echo "::error::Regenerate retention.patch when you have time."
              exit 1
            else
              echo "3-way merge applied with some fallbacks. No conflicts to resolve."
            fi
          fi

          git checkout HEAD -- gradle.properties 2>/dev/null || true

          echo "Final state:"
          git status --short
          git diff --stat HEAD

      - name: Apply retention overlay
        if: steps.already.outputs.built == 'no'
        run: |
          if [ ! -s /tmp/retention-overlay.py ]; then
            echo "No overlay script. Skipping."
            exit 0
          fi
          echo "Running overlay script..."
          if python3 /tmp/retention-overlay.py; then
            echo "Overlay applied."
            git add -A
          else
            echo "::error::Overlay script failed."
            exit 1
          fi

      - name: Set up JDK 21
        if: steps.already.outputs.built == 'no'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode keystore
        if: steps.already.outputs.built == 'no'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build APK
        if: steps.already.outputs.built == 'no'
        run: |
          chmod +x gradlew
          rm -rf app/build/outputs/apk
          ./gradlew assembleProdWebsiteRelease \
            -x lintVitalProdWebsiteRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Find and rename APK
        if: steps.already.outputs.built == 'no'
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found. Build outputs:"
            find app/build/outputs -type f 2>/dev/null | head -30
            exit 1
          fi
          FINAL_NAME="collie-retained-${{ steps.check.outputs.tag }}.apk"
          mv "$APK" "./$FINAL_NAME"
          echo "Renamed to: $FINAL_NAME ($(du -h "./$FINAL_NAME" | cut -f1))"
          echo "path=./$FINAL_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify APK version matches expected tag
        if: steps.already.outputs.built == 'no'
        run: |
          APK="${{ steps.find_apk.outputs.path }}"
          EXPECTED="${{ steps.check.outputs.tag }}"
          EXPECTED="${EXPECTED#v}"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" -type f 2>/dev/null | head -1)
          if [ -z "$AAPT2" ] || [ ! -x "$AAPT2" ]; then
            echo "::error::aapt2 not found in $ANDROID_HOME/build-tools. Cannot verify version. Aborting."
            exit 1
          fi
          echo "Using aapt2: $AAPT2"
          VERSION_NAME=$("$AAPT2" dump badging "$APK" 2>/dev/null | grep "versionName" | sed "s/.*versionName='\([^']*\)'.*/\1/")
          echo "APK versionName: $VERSION_NAME"
          echo "Expected version: $EXPECTED"
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not extract versionName from APK. Aborting."
            exit 1
          fi
          if [ "$VERSION_NAME" != "$EXPECTED" ]; then
            echo "::error::VERSION MISMATCH! APK says '$VERSION_NAME' but expected '$EXPECTED'."
            echo "::error::Refusing to publish."
            exit 1
          fi
          echo "✓ Version verified: $VERSION_NAME"

      - name: Create GitHub Release
        if: steps.already.outputs.built == 'no'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "retained-${{ steps.check.outputs.tag }}-r2"
          name: "Collie Retained ${{ steps.check.outputs.tag }}"
          body: '​'
          token: ${{ secrets.PUSH_TOKEN }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: ${{ steps.find_apk.outputs.path }}

      - name: Delete old releases (keep only latest)
        if: steps.already.outputs.built == 'no'
        env:
          CURRENT_TAG: "retained-${{ steps.check.outputs.tag }}-r2"
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          if ! curl -s -H "Authorization: token $PUSH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | python3 -c "
              import sys, json, os
              data = json.load(sys.stdin)
              if not isinstance(data, list):
                  sys.exit(1)
              current = os.environ['CURRENT_TAG']
              for r in data:
                  if r['tag_name'].startswith('retained-') and r['tag_name'] != current:
                      print(r['id'])
              " > /tmp/old_release_ids.txt; then
            echo "::warning::Could not delete old releases (API error). Skipping cleanup."
            exit 0
          fi
          COUNT=0
          while read -r ID; do
            [ -z "$ID" ] && continue
            curl -s -X DELETE -H "Authorization: token $PUSH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$ID" > /dev/null
            COUNT=$((COUNT + 1))
          done < /tmp/old_release_ids.txt
          echo "Deleted $COUNT old release(s). Keeping: $CURRENT_TAG"
