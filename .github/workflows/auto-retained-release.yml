name: Auto Retained Release

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check for new upstream release
        id: check
        run: |
          TAG=$(curl -s https://api.github.com/repos/0cwa/collieim-android/releases \
            | python3 -c "import sys,json; releases=json.load(sys.stdin); \
              print([r['tag_name'] for r in releases if not r['draft']][0])")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if already built
        id: already
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          EXISTS=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases" \
            | python3 -c "
              import sys, json, os
              releases = json.load(sys.stdin)
              tag = os.environ['TAG']
              print('yes' if any(tag in r['tag_name'] for r in releases) else 'no')
              ")
          echo "built=$EXISTS" >> "$GITHUB_OUTPUT"

      - name: Checkout fork
        if: steps.already.outputs.built == 'no'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream release
        if: steps.already.outputs.built == 'no'
        run: |
          git remote add upstream https://github.com/0cwa/collieim-android.git
          git fetch upstream "${{ steps.check.outputs.tag }}" --depth=1
          git checkout -B build "${{ steps.check.outputs.tag }}"
          git checkout origin/main -- patches/forks/signal-foss/retention-controls/
          git checkout origin/main -- patches/forks/signal-foss/retention-controls-fixes/

      - name: Apply retention patches
        if: steps.already.outputs.built == 'no'
        run: |
          set -e
          PATCH1="patches/forks/signal-foss/retention-controls/0001-retention-controls.patch"
          PATCH2="patches/forks/signal-foss/retention-controls-fixes/0001-retention-controls-fixes.patch"

          apply_patch() {
            local patch_file="$1"
            local label="$2"

            echo "=== Applying: $label ==="

            # Attempt 1: clean apply
            if git apply --check "$patch_file" 2>/dev/null; then
              echo "  → Clean apply succeeded"
              git apply "$patch_file"
              return 0
            fi

            # Attempt 2: 3-way merge
            echo "  → Clean apply failed, trying 3-way merge..."
            if git apply --3way "$patch_file" 2>/dev/null; then
              echo "  → 3-way merge succeeded"
              return 0
            fi

            # Attempt 3: GNU patch with high fuzz
            echo "  → 3-way failed, trying patch --fuzz=5..."
            if patch --batch --forward --fuzz=5 -p1 < "$patch_file"; then
              echo "  → patch --fuzz=5 succeeded"
              find . -name "*.orig" -delete 2>/dev/null || true
              return 0
            fi

            # All attempts failed
            echo "::error::FAILED to apply $label ($patch_file)"
            echo "::error::The upstream source has changed too much. Re-base the patch manually."
            return 1
          }

          apply_patch "$PATCH1" "retention-controls"
          apply_patch "$PATCH2" "retention-controls-fixes"

          echo "=== All patches applied successfully ==="
          git diff --stat

      - name: Set up JDK 21
        if: steps.already.outputs.built == 'no'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode keystore
        if: steps.already.outputs.built == 'no'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          GRADLE_DAEMON_DIR=$(find /home/runner/.gradle/daemon -maxdepth 1 -type d 2>/dev/null | tail -1)
          if [ -z "$GRADLE_DAEMON_DIR" ]; then
            GRADLE_DAEMON_DIR="/home/runner/.gradle/daemon/9.6.0"
            mkdir -p "$GRADLE_DAEMON_DIR"
          fi
          cp release.keystore "$GRADLE_DAEMON_DIR/release.keystore"

      - name: Build APK
        if: steps.already.outputs.built == 'no'
        run: |
          chmod +x gradlew
          ./gradlew assembleProdWebsiteRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Find APK
        if: steps.already.outputs.built == 'no'
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk -name "*prodWebsiteRelease*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.already.outputs.built == 'no'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "retained-${{ steps.check.outputs.tag }}"
          name: "Collie Retained ${{ steps.check.outputs.tag }}"
          body: |
            Auto-built from Collie `${{ steps.check.outputs.tag }}` with retention controls:
            - Keep view-once media
            - Keep expiring messages
            - Ignore remote delete
            - Delete media only
          files: ${{ steps.find_apk.outputs.path }}
