name: Gen Overlay 2
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: retention
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN }}
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/0cwa/collieim-android.git 2>/dev/null || true
          git fetch upstream --tags
      - name: Show retention fields
        run: |
          STATE_FILE="feature/app-settings/src/main/java/org/signal/appsettings/chats/ChatsSettingsState.kt"
          echo "=== DIFF (upstream v8.36.3-2 vs your retention) ==="
          git diff v8.36.3-2..HEAD -- "$STATE_FILE"
          echo ""
          echo "=== Your version (first 40 lines) ==="
          git show HEAD:"$STATE_FILE" | head -40
