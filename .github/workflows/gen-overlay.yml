name: Gen Overlay

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: retention
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/0cwa/collieim-android.git 2>/dev/null || true
          git fetch upstream --tags

      - name: Generate and commit overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff v8.36.3-1-rc2..HEAD \
            -- feature/app-settings/src/main/java/org/signal/appsettings/chats/ChatsSettingsState.kt \
               feature/app-settings/src/test/java/org/signal/appsettings/chats/ChatsSettingsScreenTest.kt \
            > retention-overlay.patch
          if [ ! -s retention-overlay.patch ]; then
            echo "::warning::Overlay is empty."
            touch retention-overlay.patch
          fi
          echo "Overlay content:"
          cat retention-overlay.patch
          git add retention-overlay.patch
          git commit -m "Add retention-overlay.patch for conflicted files"
          git push origin retention
